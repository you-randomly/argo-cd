apiVersion: v1
kind: ConfigMap
metadata:
  name: hubble-flows-dashboard
  namespace: victoria-metrics
  labels:
    grafana_dashboard: "1"
data:
  hubble-flows.json: |-
    {
      "title": "Hubble Network Flows",
      "tags": ["cilium", "hubble", "flows", "network"],
      "timezone": "browser",
      "panels": [
        {
          "title": "Flows by Verdict",
          "type": "timeseries",
          "datasource": "VictoriaLogs",
          "targets": [
            {
              "expr": "_stream:{k8s.container.name=\"cilium-agent\"} AND \"flow\" AND \"verdict\" | unpack_json | stats by (flow.verdict) count()",
              "queryType": "statsRange",
              "legendFormat": "{{flow.verdict}}"
            }
          ],
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 0 }
        },
        {
          "title": "Raw Flow Logs",
          "type": "logs",
          "datasource": "VictoriaLogs",
          "targets": [
            {
              "expr": "_stream:{k8s.container.name=\"cilium-agent\"} AND \"flow\" AND \"verdict\" | unpack_json | format \"[%{flow.verdict}] %{flow.source.namespace}/%{flow.source.pod_name} -> %{flow.destination.namespace}/%{flow.destination.pod_name} (Port: %{flow.l4.TCP.destination_port})\"",
              "queryType": "range"
            }
          ],
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 8 },
          "options": {
            "showTime": true,
            "showLabels": false
          }
        }
      ]
    }
