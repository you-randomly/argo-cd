apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-app-troubleshooting-dashboard
  namespace: victoria-metrics
  labels:
    grafana_dashboard: '1'
data:
  k8s-app-troubleshooting.json: |-
    {
      "title": "K8s App Troubleshooting",
      "tags": [
        "kubernetes",
        "troubleshooting",
        "cilium",
        "traces"
      ],
      "timezone": "browser",
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": "VictoriaMetrics",
            "query": "label_values(kube_pod_info, namespace)",
            "refresh": 1
          },
          {
            "name": "pod",
            "type": "query",
            "datasource": "VictoriaMetrics",
            "query": "label_values(kube_pod_info{namespace=\"$namespace\"}, pod)",
            "refresh": 1
          },
          {
            "name": "trace_id",
            "type": "textbox",
            "hide": 2,
            "current": {
              "value": "",
              "text": ""
            },
            "options": [
              {
                "value": "",
                "text": ""
              }
            ],
            "query": ""
          }
        ]
      },
      "panels": [
        {
          "title": "CPU Usage",
          "type": "timeseries",
          "datasource": "VictoriaMetrics",
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"$namespace\", pod=~\"$pod\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 0
          }
        },
        {
          "title": "Memory Usage",
          "type": "timeseries",
          "datasource": "VictoriaMetrics",
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"$namespace\", pod=~\"$pod\"}) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 0
          }
        },
        {
          "title": "HTTP Status Codes (Hubble)",
          "type": "timeseries",
          "datasource": "VictoriaMetrics",
          "targets": [
            {
              "expr": "sum(rate(hubble_http_responses_total{destination=\"$namespace/$pod\"}[5m])) by (status)",
              "legendFormat": "HTTP {{status}}"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 0
          }
        },
        {
          "title": "Traces (Tempo)",
          "type": "table",
          "datasource": "Tempo",
          "targets": [
            {
              "query": "{.k8s.pod.name=\"$pod\"}",
              "queryType": "traceql"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Trace ID"
                },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "targetBlank": false,
                        "title": "View Trace",
                        "url": "?var-namespace=$namespace&var-pod=$pod&var-trace_id=${__value.raw}"
                      }
                    ]
                  }
                ]
              }
            ]
          }
        },
        {
          "title": "Application Logs (VictoriaLogs)",
          "type": "logs",
          "datasource": "VictoriaLogs",
          "targets": [
            {
              "expr": "_stream:{k8s.namespace.name=\"$namespace\", k8s.pod.name=~\"$pod.*\"}"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 16
          }
        },
        {
          "title": "Network Flows by Verdict (Hubble)",
          "type": "timeseries",
          "datasource": "VictoriaLogs",
          "targets": [
            {
              "expr": "_stream:{k8s.container.name=\"cilium-agent\"} AND \"flow\" AND \"$namespace\" AND \"$pod\" | unpack_json | filter flow.verdict:* AND (flow.source.namespace:\"$namespace\" OR flow.destination.namespace:\"$namespace\") AND (flow.source.pod_name:\"$pod\" OR flow.destination.pod_name:\"$pod\") | stats by (flow.verdict) count()",
              "queryType": "statsRange",
              "legendFormat": "{{flow.verdict}}"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 34
          }
        },
        {
          "title": "Raw Network Flow Logs (Hubble)",
          "type": "logs",
          "datasource": "VictoriaLogs",
          "targets": [
            {
              "expr": "_stream:{k8s.container.name=\"cilium-agent\"} AND \"flow\" AND \"$namespace\" AND \"$pod\" | unpack_json | filter flow.verdict:* AND (flow.source.namespace:\"$namespace\" OR flow.destination.namespace:\"$namespace\") AND (flow.source.pod_name:\"$pod\" OR flow.destination.pod_name:\"$pod\") | format \"[<flow.verdict>] <flow.source.namespace>/<flow.source.pod_name> -> <flow.destination.namespace>/<flow.destination.pod_name> (<flow.Summary>)\"",
              "queryType": "range"
            }
          ],
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 42
          },
          "options": {
            "showTime": true,
            "showLabels": false
          }
        },
        {
          "title": "Selected Trace ($trace_id)",
          "type": "traces",
          "datasource": "Tempo",
          "targets": [
            {
              "queryType": "traceql",
              "query": "$trace_id"
            }
          ],
          "transparent": true,
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 24
          }
        }
      ]
    }
