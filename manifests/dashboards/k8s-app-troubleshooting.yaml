apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-app-troubleshooting-dashboard
  namespace: victoria-metrics
  labels:
    grafana_dashboard: "1"
data:
  k8s-app-troubleshooting.json: |-
    {
      "title": "K8s App Troubleshooting",
      "tags": ["kubernetes", "troubleshooting", "cilium", "traces"],
      "timezone": "browser",
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": "VictoriaMetrics",
            "query": "label_values(kube_pod_info, namespace)",
            "refresh": 1
          },
          {
            "name": "pod",
            "type": "query",
            "datasource": "VictoriaMetrics",
            "query": "label_values(kube_pod_info{namespace=\"$namespace\"}, pod)",
            "refresh": 1
          }
        ]
      },
      "panels": [
        {
          "title": "CPU Usage",
          "type": "timeseries",
          "datasource": "VictoriaMetrics",
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"$namespace\", pod=~\"$pod\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ],
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 0 }
        },
        {
          "title": "Memory Usage",
          "type": "timeseries",
          "datasource": "VictoriaMetrics",
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"$namespace\", pod=~\"$pod\"}) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ],
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 0 }
        },
        {
          "title": "HTTP Status Codes (Hubble)",
          "type": "timeseries",
          "datasource": "VictoriaMetrics",
          "targets": [
            {
              "expr": "sum(rate(hubble_http_responses_total{destination=\"$namespace/$pod\"}[5m])) by (status)",
              "legendFormat": "HTTP {{status}}"
            }
          ],
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 0 }
        },
        {
          "title": "Traces (Tempo)",
          "type": "traces",
          "datasource": "Tempo",
          "targets": [
            {
              "query": "{.service.name=\"*\" && .k8s.pod.name=\"$pod\"}"
            }
          ],
          "gridPos": { "h": 10, "w": 12, "x": 0, "y": 8 }
        },
        {
          "title": "Application Logs (VictoriaLogs)",
          "type": "logs",
          "datasource": "VictoriaLogs",
          "targets": [
            {
              "expr": "_stream:{k8s.namespace.name=\"$namespace\", k8s.pod.name=~\"$pod.*\"}"
            }
          ],
          "gridPos": { "h": 10, "w": 12, "x": 12, "y": 8 }
        }
      ]
    }
